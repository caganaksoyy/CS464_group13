[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pianist_id"
version = "0.1.0"
description = "Pianist identification from expressive piano MIDI performances (ATEPP)."
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds only. Colab already ships these; exact pins for the packages Colab
# does NOT ship live in requirements.txt. torch is deliberately not listed here so
# that `pip install -e .` can never replace Colab's CUDA build of torch.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pyarrow>=14",
    "pretty_midi>=0.2.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "gdown>=4.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: executes notebooks end to end (deselect with -m 'not slow')",
]
